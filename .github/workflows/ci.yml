name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-gcc:
    name: Unit Tests (GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libgtest-dev

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-gcc-release-ccache

      - name: Configure CMake (GCC Release)
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON

      - name: Build unit tests & CLI
        run: cmake --build build -j$(nproc)

      - name: Run C++ unit tests
        run: ./build/imagine_tests

      - name: Step Summary
        if: always()
        run: |
          echo "### Unit Tests (GCC) :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- **Compiler:** GCC (\`g++\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Build Type:** Release" >> $GITHUB_STEP_SUMMARY

  clang-sanitizers-ui:
    name: Clang + Sanitizers + UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libgtest-dev clang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/ui/requirements.txt

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('tests/ui/requirements.txt') }}

      - name: Install Playwright Chromium with system dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
            playwright install-deps chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-sanitizers-ui-ccache

      - name: Configure CMake with Clang & Sanitizers (ASan + UBSan)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON

      - name: Build with Clang & Sanitizers
        run: cmake --build build -j$(nproc)

      - name: Run Unit Tests under ASan & UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/imagine_tests

      - name: Run Playwright UI Tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: pytest tests/ui -v

      - name: Upload Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            /tmp/imagine_ui_*
          if-no-files-found: ignore

      - name: Step Summary
        if: always()
        run: |
          echo "### Clang + Sanitizers + UI Tests Completed :white_check_mark:" >> $GITHUB_STEP_SUMMARY
          echo "- **Compiler:** Clang (\`clang++\`)" >> $GITHUB_STEP_SUMMARY
          echo "- **Sanitizers:** AddressSanitizer & UndefinedBehaviorSanitizer (Clean, 0 errors/leaks)" >> $GITHUB_STEP_SUMMARY
          echo "- **Unit Tests:** 64 unit tests passed under ASan & UBSan" >> $GITHUB_STEP_SUMMARY
          echo "- **UI Tests:** 53 deterministic Playwright browser tests passed" >> $GITHUB_STEP_SUMMARY

  windows-msvc:
    name: Windows Build & Tests (MSVC)
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ runner.os }}-vcpkg-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-

      - name: Create vcpkg cache directory
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg-cache" | Out-Null

      - name: Configure CMake (MSVC Release)
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:/vcpkg" }
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_TESTING=ON

      - name: Build unit tests & CLI
        run: cmake --build build --parallel

      - name: Verify CLI binary
        run: .\build\imagine.exe --help

      - name: Run C++ unit tests
        run: .\build\imagine_tests.exe

      - name: Step Summary
        if: always()
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows Build & Tests (MSVC) :white_check_mark:"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Compiler:** MSVC (\`cl.exe\`)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Build Type:** Release"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Dependencies:** vcpkg manifest mode (OpenSSL, Zlib)"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Unit Tests:** 102 unit tests passed"


name: CI

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unit-tests-gcc:
    name: Unit Tests (GCC)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libgtest-dev

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-gcc-release-ccache

      - name: Configure CMake (GCC Release)
        env:
          CC: gcc
          CXX: g++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON

      - name: Build unit tests & CLI
        run: cmake --build build -j$(nproc)

      - name: Run C++ unit tests
        run: ./build/imagine_tests --gtest_output=xml:build/unit-test-results.xml

      - name: Step Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            unit_tests=$(python3 -c "import xml.etree.ElementTree as ET; print(ET.parse('build/unit-test-results.xml').getroot().attrib['tests'])")
            echo "### Unit Tests (GCC) :white_check_mark:" >> $GITHUB_STEP_SUMMARY
            echo "- **Compiler:** GCC (\`g++\`)" >> $GITHUB_STEP_SUMMARY
            echo "- **Build Type:** Release" >> $GITHUB_STEP_SUMMARY
            echo "- **Unit Tests:** $unit_tests unit tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Unit Tests (GCC) :x:" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** Job failed" >> $GITHUB_STEP_SUMMARY
          fi

  clang-sanitizers-ui:
    name: Clang + Sanitizers + UI Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build libssl-dev libgtest-dev clang

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Python test requirements
        run: |
          python -m pip install --upgrade pip
          pip install -r tests/ui/requirements.txt

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(python -c 'import playwright; print(playwright.__version__)')" >> $GITHUB_OUTPUT

      - name: Cache Playwright Browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Chromium with system dependencies
        run: |
          if [ "${{ steps.playwright-cache.outputs.cache-hit }}" == "true" ]; then
            playwright install-deps chromium
            playwright install chromium
          else
            playwright install --with-deps chromium
          fi

      - name: Set up ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ runner.os }}-clang-sanitizers-ui-ccache

      - name: Configure CMake with Clang & Sanitizers (ASan + UBSan)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -B build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DENABLE_SANITIZERS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DBUILD_TESTING=ON

      - name: Build with Clang & Sanitizers
        run: cmake --build build -j$(nproc)

      - name: Run Unit Tests under ASan & UBSan
        env:
          ASAN_OPTIONS: detect_leaks=1:abort_on_error=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./build/imagine_tests --gtest_output=xml:build/unit-test-results.xml

      - name: Run Playwright UI Tests
        env:
          ASAN_OPTIONS: detect_leaks=0
        run: pytest tests/ui -n 4 --dist loadfile --junitxml=build/ui-test-results.xml -v

      - name: Upload Artifacts on Failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-artifacts
          path: |
            /tmp/imagine_ui_*
          if-no-files-found: ignore

      - name: Step Summary
        if: always()
        run: |
          if [ "${{ job.status }}" == "success" ]; then
            unit_tests=$(python -c "import xml.etree.ElementTree as ET; print(ET.parse('build/unit-test-results.xml').getroot().attrib['tests'])")
            ui_tests=$(python -c "import xml.etree.ElementTree as ET; print(sum(int(s.attrib.get('tests', 0)) for s in ET.parse('build/ui-test-results.xml').getroot().iter('testsuite')))")
            echo "### Clang + Sanitizers + UI Tests Completed :white_check_mark:" >> $GITHUB_STEP_SUMMARY
            echo "- **Compiler:** Clang (\`clang++\`)" >> $GITHUB_STEP_SUMMARY
            echo "- **Sanitizers:** AddressSanitizer & UndefinedBehaviorSanitizer (Clean, 0 errors/leaks)" >> $GITHUB_STEP_SUMMARY
            echo "- **Unit Tests:** $unit_tests unit tests passed under ASan & UBSan" >> $GITHUB_STEP_SUMMARY
            echo "- **UI Tests:** $ui_tests deterministic Playwright browser tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "### Clang + Sanitizers + UI Tests :x:" >> $GITHUB_STEP_SUMMARY
            echo "- **Status:** Job failed" >> $GITHUB_STEP_SUMMARY
          fi

  windows-msvc:
    name: Windows Build & Tests (MSVC)
    runs-on: windows-latest
    env:
      SCCACHE_GHA_ENABLED: "true"
      VCPKG_BINARY_SOURCES: "clear;files,${{ github.workspace }}/vcpkg-cache,readwrite"
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Get MSVC toolset version
        id: msvc-toolset
        run: '"version=$env:VCToolsVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Append'

      - name: Cache vcpkg dependencies
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/vcpkg-cache
          key: ${{ runner.os }}-vcpkg-${{ steps.msvc-toolset.outputs.version }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            ${{ runner.os }}-vcpkg-${{ steps.msvc-toolset.outputs.version }}-

      - name: Create vcpkg cache directory
        run: New-Item -ItemType Directory -Force -Path "${{ github.workspace }}/vcpkg-cache" | Out-Null

      - name: Set up sccache
        uses: mozilla-actions/sccache-action@v0.0.11

      - name: Configure CMake (MSVC Release)
        run: |
          $vcpkgRoot = if ($env:VCPKG_INSTALLATION_ROOT) { $env:VCPKG_INSTALLATION_ROOT } else { "C:/vcpkg" }
          cmake -B build -G Ninja `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_C_COMPILER_LAUNCHER=sccache `
            -DCMAKE_CXX_COMPILER_LAUNCHER=sccache `
            -DCMAKE_TOOLCHAIN_FILE="$vcpkgRoot/scripts/buildsystems/vcpkg.cmake" `
            -DBUILD_TESTING=ON

      - name: Build unit tests & CLI
        run: cmake --build build --parallel

      - name: Verify CLI binary
        run: .\build\imagine.exe --help

      - name: Run C++ unit tests
        run: .\build\imagine_tests.exe --gtest_output=xml:build/unit-test-results.xml

      - name: Step Summary
        if: always()
        run: |
          if ("${{ job.status }}" -eq "success") {
            [xml]$testResults = Get-Content "build/unit-test-results.xml"
            $unitTests = $testResults.testsuites.tests
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows Build & Tests (MSVC) :white_check_mark:"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Compiler:** MSVC (\`cl.exe\`)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Build Type:** Release"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Dependencies:** vcpkg manifest mode (OpenSSL, Zlib)"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Unit Tests:** $unitTests unit tests passed"
          } else {
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "### Windows Build & Tests (MSVC) :x:"
            Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- **Status:** Job failed"
          }

